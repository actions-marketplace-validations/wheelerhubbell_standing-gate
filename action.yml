name: 'Standing Gate'
description: 'Autonomous Decision Integrity circuit breaker: evaluates claims, authority, and provenance against WHP epistemic reasoning.'
author: 'wheelerhubbell'
branding:
  icon: 'shield'
  color: 'blue'
inputs:
  api_key:
    description: 'WHP Subscription API Key (Developer, Team, or Institutional tier). Bypasses per-call x402 challenge.'
    required: false
    default: ''
  service_url:
    description: 'Standing Witness service base URL'
    required: false
    default: 'https://api.wheelerhubbellpublishing.com'
  door:
    description: 'Door endpoint to evaluate against (/v1/evaluate, /v1/audit, /v1/ping)'
    required: false
    default: '/v1/evaluate'
  subject:
    description: 'Subject identifier or repository claim'
    required: false
    default: '${{ github.repository }}@${{ github.sha }}'
  claim:
    description: 'Claim to verify or audit'
    required: false
    default: 'CI/CD pipeline release integrity verification'
  provenance:
    description: 'Provenance URI or structured evidence payload (string or JSON)'
    required: false
    default: ''
  structured_input:
    description: 'Complete JSON request body for /v1/evaluate; use the production route contract and optional evaluator fields as supported.'
    required: false
    default: ''
  mock:
    description: 'Set to "true" for free dry-run structural verification'
    required: false
    default: 'false'
  payment_signature:
    description: 'x402 PAYMENT-SIGNATURE or authorization token for paid doors'
    required: false
    default: ''
  buyer_key:
    description: 'Private key for dynamic EIP-3009 signing on HTTP 402 challenge'
    required: false
    default: ''
outputs:
  determination:
    description: 'Evaluation determination outcome'
    value: ${{ steps.gate.outputs.outcome }}
  record_hash:
    description: 'SHA-256 hash of the canonical signed evaluation record'
    value: ${{ steps.gate.outputs.hash }}
  record_json:
    description: 'Complete signed evaluation response envelope returned by the service'
    value: ${{ steps.gate.outputs.record_json }}
  signature_status:
    description: 'Signature verification result against the key from live evaluation discovery'
    value: ${{ steps.gate.outputs.signature_status }}
  reception_event_json:
    description: 'Separate client reception event; does not mutate the evaluation record'
    value: ${{ steps.gate.outputs.reception_event_json }}

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - id: gate
      shell: bash
      env:
        WHP_URL: ${{ inputs.service_url }}
        WHP_DOOR: ${{ inputs.door }}
        WHP_SUBJECT: ${{ inputs.subject }}
        WHP_CLAIM: ${{ inputs.claim }}
        WHP_PROVENANCE: ${{ inputs.provenance || env.WHP_PROVENANCE }}
        WHP_INPUT_JSON: ${{ inputs.structured_input }}
        WHP_MOCK: ${{ inputs.mock }}
        WHP_API_KEY: ${{ inputs.api_key || env.WHP_API_KEY }}
        WHP_PAYMENT: ${{ inputs.payment_signature }}
        WHP_PAYMENT_KEY: ${{ env.WHP_PAYMENT_KEY }}
        WHP_BUYER_KEY: ${{ inputs.buyer_key || env.WHP_BUYER_KEY }}
        WHP_REPOSITORY: ${{ github.repository }}
        WHP_SHA: ${{ github.sha }}
        WHP_REF: ${{ github.ref }}
        WHP_ACTOR: ${{ github.actor }}
      run: |
        if [ -n "$WHP_BUYER_KEY" ] || [ -n "$WHP_PAYMENT_KEY" ]; then
          node -e "import('viem/accounts').catch(() => process.exit(1))" 2>/dev/null || npm i --no-save viem@^2.21.0
        fi
        node "${{ github.action_path }}/gate-check.cjs"
